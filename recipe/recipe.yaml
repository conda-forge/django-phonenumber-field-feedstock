schema_version: 1

context:
  name: django-phonenumber-field
  version: 8.3.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/django_phonenumber_field-${{ version }}.tar.gz
  sha256: 193b3acc3b83ff4aad95dd9530a6d01e1c7c1cecbdfa8a56159789bbb85ab0e2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - setuptools >=42
    - setuptools-scm >=3.4
    - tomli
    - pip
  run:
    - python >=${{ python_min }}.*
    - django >=4.2

tests:
  - python:
      imports:
        - phonenumber_field
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: An international phone number field for django models.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/stefanfoulis/django-phonenumber-field
  documentation: https://django-phonenumber-field.readthedocs.io/

extra:
  recipe-maintainers:
    - thewchan
